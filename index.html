<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>アイコンリング合成</title>
<style>
:root{font-family:system-ui,sans-serif;color:#283047;background:#f4f3fa}*{box-sizing:border-box}body{margin:0}header{max-width:1100px;margin:auto;padding:36px 24px 24px}h1{font-size:28px;margin:8px 0}p{color:#697086;line-height:1.7}.tag{color:#7861ba;font-size:12px;font-weight:700;letter-spacing:2px}main{max-width:1100px;margin:auto;padding:0 24px 32px;display:grid;grid-template-columns:1.2fr 1fr;gap:24px}.card{background:white;border:1px solid #e4e1ed;border-radius:20px;padding:24px;box-shadow:0 8px 30px #32235406}h2{font-size:17px;margin:0 0 18px}.preview{display:flex;align-items:center;justify-content:center;background:#eeedf4;border-radius:14px;padding:20px}canvas{width:100%;max-width:480px;aspect-ratio:1;touch-action:none;background-color:white;background-image:conic-gradient(#e4e3eb 25%,transparent 0 50%,#e4e3eb 0 75%,transparent 0);background-size:20px 20px;border-radius:8px}label{display:block;font-size:14px;margin:14px 0 7px}input[type=file]{width:100%;border:1px dashed #b9afce;padding:12px;border-radius:10px;background:#faf9ff}input[type=range]{width:100%;accent-color:#8061c8}select,button{font:inherit;border-radius:10px;padding:10px 14px;border:1px solid #dcd7e8;background:white;color:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}.primary{background:#7960bf;color:white;border:0;width:100%;padding:14px;font-weight:700}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row label{margin:8px 0}fieldset{border:0;padding:0;margin:20px 0}legend{font-weight:700;font-size:15px;border-bottom:1px solid #eee9f5;width:100%;padding-bottom:10px}output{float:right;color:#7960bf}small{display:block;color:#787e90;line-height:1.7;margin-top:10px}#status{min-height:24px;color:#7960bf;font-size:14px}input[type=checkbox]{accent-color:#7960bf}.hint{font-size:13px;margin:12px 0}footer{max-width:1100px;margin:auto;padding:0 24px 28px;font-size:12px;color:#787e90}@media(max-width:760px){main{grid-template-columns:1fr;padding:0 16px 24px}header{padding:24px 16px 16px}.card{padding:18px}h1{font-size:24px}}
</style>
<header><span class="tag">ICON RING COMPOSER</span><h1>アイコンリング合成</h1><p>お気に入りのアイコンに、リングを重ねて。<br>画像を選んで調整したら、PNGで保存できます。</p></header>
<main><section class="card"><h2>プレビュー</h2><div class="preview"><canvas id="canvas" width="1024" height="1024" aria-label="合成画像のプレビュー"></canvas></div><p class="hint">プレビューをドラッグすると、選択中の画像を移動できます。</p><div class="row"><label>動かす画像 <select id="target"><option value="icon">アイコン</option><option value="ring">リング</option></select></label><button id="reset" type="button">位置・サイズをリセット</button></div><p id="status" role="status" aria-live="polite">アイコン画像を選んでください。</p><button class="primary" id="save" disabled>PNGを保存</button><small>画像は端末内で処理されます。サーバーへの送信はありません。</small></section>
<section class="card"><h2>画像と調整</h2><label for="iconFile">1. アイコン画像</label><input type="file" id="iconFile" accept="image/png,image/jpeg,image/webp"><label for="ringFile">2. リング画像（任意）</label><input type="file" id="ringFile" accept="image/png,image/jpeg,image/webp"><small>中央が透明なPNGがおすすめです。リングを選ばない場合は、下の単色リングを使用します。</small>
<fieldset><legend>アイコン</legend><label for="iconScale">サイズ <output id="iconScaleValue">100%</output></label><input id="iconScale" type="range" min="10" max="300" value="100"><label for="iconAngle">回転 <output id="iconAngleValue">0°</output></label><input id="iconAngle" type="range" min="-180" max="180" value="0"><label><input id="clip" type="checkbox" checked> アイコンを円形に切り抜く</label></fieldset>
<fieldset><legend>リング</legend><label for="ringScale">サイズ <output id="ringScaleValue">100%</output></label><input id="ringScale" type="range" min="10" max="200" value="100"><label for="ringAngle">回転 <output id="ringAngleValue">0°</output></label><input id="ringAngle" type="range" min="-180" max="180" value="0"><div class="row"><label for="color">単色リングの色</label><input type="color" id="color" value="#9b7bda"><button id="clearRing">単色リングに戻す</button></div><label for="thickness">単色リングの太さ <output id="thicknessValue">5%</output></label><input id="thickness" type="range" min="0" max="20" value="5"></fieldset>
<div class="row"><label for="size">保存サイズ</label><select id="size"><option value="512">512 × 512 px</option><option value="1024" selected>1024 × 1024 px</option><option value="2048">2048 × 2048 px</option></select></div><small>PNG / JPEG / WebP対応。透明部分は透過PNGとして保存されます。</small></section></main><footer>リング素材は、利用条件を確認してお使いください。</footer><script src="app.js"></script>
</html>
